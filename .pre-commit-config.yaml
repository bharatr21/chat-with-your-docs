# Pre-commit hooks configuration
# Install: pip install pre-commit
# Setup: pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]  # Allow custom YAML tags
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  # Backend: Python linting and formatting with Ruff
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      # Run the linter
      - id: ruff
        name: ruff lint (backend)
        args: [--fix]
        files: ^backend/
        types_or: [python, pyi]

      # Run the formatter
      - id: ruff-format
        name: ruff format (backend)
        files: ^backend/
        types_or: [python, pyi]

  # Frontend: ESLint
  - repo: local
    hooks:
      - id: eslint
        name: ESLint (frontend)
        entry: bash -c 'cd frontend && npm run lint -- --fix'
        language: system
        files: ^frontend/.*\.(ts|tsx|js|jsx)$
        pass_filenames: false

  # Frontend: TypeScript type checking
  - repo: local
    hooks:
      - id: tsc
        name: TypeScript check (frontend)
        entry: bash -c 'cd frontend && npx tsc --noEmit'
        language: system
        files: ^frontend/.*\.(ts|tsx)$
        pass_filenames: false

  # Frontend: Prettier (optional, add if you want formatting)
  # - repo: https://github.com/pre-commit/mirrors-prettier
  #   rev: v4.0.0-alpha.8
  #   hooks:
  #     - id: prettier
  #       name: Prettier (frontend)
  #       files: ^frontend/.*\.(ts|tsx|js|jsx|json|css|md)$
  #       args: [--write, --ignore-unknown]

# Configuration
default_language_version:
  python: python3.13

# Files to exclude from all hooks
exclude: |
  (?x)^(
      frontend/node_modules/.*|
      backend/.venv/.*|
      backend/.pytest_cache/.*|
      frontend/.next/.*|
      .*\.min\.(js|css)$|
      .*\.map$
  )$

# Don't run hooks on specific branches
# ci:
#   skip: [eslint, tsc]
