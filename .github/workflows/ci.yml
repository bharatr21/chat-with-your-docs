name: CI/CD Pipeline

on:
  push:
    branches: [main, vercel]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        working-directory: ./backend
        run: uv sync

      - name: Run critical backend tests
        working-directory: ./backend
        run: |
          uv run pytest \
            tests/test_api_chat.py \
            tests/test_api_documents.py \
            tests/test_api_sessions.py \
            tests/test_rag_pipeline.py \
            tests/test_llm_provider.py \
            tests/test_config.py \
            -v --tb=short
        env:
          DEFAULT_HF_API_KEY: ${{ secrets.DEFAULT_HF_API_KEY || 'test_key' }}

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run critical frontend tests
        working-directory: ./frontend
        run: |
          npx vitest run \
            src/lib/api.test.ts \
            src/components/chat/ChatInterface.test.tsx \
            src/components/documents/DocumentUpload.test.tsx \
            src/components/models/ModelSelector.test.tsx
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    continue-on-error: true  # Don't fail CI if E2E tests fail

    steps:
      - uses: actions/checkout@v4

      # Setup backend
      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.13

      - name: Install backend dependencies
        working-directory: ./backend
        run: uv sync

      # Setup frontend
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      - name: Check backend health
        run: |
          echo "Checking if backend is running..."
          curl -f http://localhost:8000/health || echo "Backend health check failed"
          curl -f http://localhost:8000/api/models || echo "Models endpoint failed"
        continue-on-error: true

      - name: Run E2E tests
        working-directory: ./frontend
        run: npx playwright test
        env:
          DEFAULT_HF_API_KEY: ${{ secrets.DEFAULT_HF_API_KEY || 'test_key' }}
          NEXT_PUBLIC_API_URL: http://localhost:8000
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  lint:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Backend linting
      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.13

      - name: Install backend dependencies
        working-directory: ./backend
        run: uv sync

      - name: Run ruff check
        working-directory: ./backend
        run: uv run ruff check .
        continue-on-error: true

      # Frontend linting
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run ESLint
        working-directory: ./frontend
        run: npm run lint
        continue-on-error: true
